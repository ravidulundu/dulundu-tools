<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dulundu.tools - Developer Utilities</title>

    <script>
      (function () {
        try {
          const stored = localStorage.getItem("theme");
          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;

          if (stored === "dark" || (!stored && systemDark)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Preconnects for external resources -->
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://aistudiocdn.com" />
    <link rel="dns-prefetch" href="https://stats.dulundu.tools" />

    <link rel="preconnect" href="https://aistudiocdn.com" crossorigin />
    <link rel="preconnect" href="https://stats.dulundu.tools" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Inline font faces to eliminate waterfall -->
    <style>
      /* Inter Font Family - Inlined for optimal LCP */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/inter-regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/fonts/inter-medium.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/fonts/inter-semibold.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/inter-bold.woff2") format("woff2");
      }

      /* Critical inline styles for LCP element - uses CSS variables */
      body {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        margin: 0;
        background-color: rgb(var(--background));
        color: rgb(var(--foreground));
        transition: background-color 0.2s, color 0.2s;
      }
      #root {
        min-height: 100vh;
      }
    </style>

    <!-- Preload critical fonts BEFORE CSS -->
    <link
      rel="preload"
      href="/fonts/inter-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-semibold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Main stylesheet - non-blocking with preload -->
    <link rel="preload" href="/src/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="/src/index.css" /></noscript>
  </head>

  <body class="bg-background text-foreground transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
