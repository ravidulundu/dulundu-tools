<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dulundu.tools - Developer Utilities</title>

    <!-- Preconnects (Earliest possible connection) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical fonts to eliminate render blocking -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiA.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuGKYAZ9hiA.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://stats.dulundu.tools" />
    <link rel="dns-prefetch" href="https://aistudiocdn.com" />

    <link rel="preconnect" href="https://stats.dulundu.tools" crossorigin />
    <link rel="preconnect" href="https://aistudiocdn.com" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Font Optimization (Non-blocking) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Analytics ---->
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
    <link rel="stylesheet" href="/index.css" />
    
    <!-- Preload main module for faster script execution -->
    <link rel="modulepreload" href="/index.tsx" />
  </head>

  <body
    class="bg-gray-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200"
  >
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
